name: novamercado

x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: docker/airflow/Dockerfile
  image: novamercado-airflow:local
  environment: &airflow-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${AIRFLOW_DB_USER}:${AIRFLOW_DB_PASSWORD}@airflow-db:5432/${AIRFLOW_DB_NAME}
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY}
    AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_SECRET_KEY}
    AIRFLOW__API__AUTH_BACKENDS: airflow.api.auth.backend.basic_auth,airflow.api.auth.backend.session
    # Conexiones que usará el DAG de reentrenamiento
    NOVA_DB_URL: postgresql+psycopg2://${APP_DB_USER}:${APP_DB_PASSWORD}@db:5432/${APP_DB_NAME}
    MLFLOW_TRACKING_URI: http://mlflow:5000
    DATOS_DIR: /datos
  volumes:
    - ./datos_lab2:/datos:ro
    - airflow-logs:/opt/airflow/logs
  depends_on: &airflow-depends
    airflow-db:
      condition: service_healthy

services:
  # Base de datos propia del producto (separada de la de Airflow)
  db:
    image: postgres:16.4
    environment:
      POSTGRES_USER: ${APP_DB_USER}
      POSTGRES_PASSWORD: ${APP_DB_PASSWORD}
      POSTGRES_DB: ${APP_DB_NAME}
    volumes:
      - app-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${APP_DB_USER} -d ${APP_DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  # Base de datos de metadatos de Airflow
  airflow-db:
    image: postgres:16.4
    environment:
      POSTGRES_USER: ${AIRFLOW_DB_USER}
      POSTGRES_PASSWORD: ${AIRFLOW_DB_PASSWORD}
      POSTGRES_DB: ${AIRFLOW_DB_NAME}
    volumes:
      - airflow-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${AIRFLOW_DB_USER} -d ${AIRFLOW_DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.16.2
    command: >
      mlflow server
      --host 0.0.0.0
      --port 5000
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --artifacts-destination /mlflow/artifacts
      --serve-artifacts
    ports:
      - "${MLFLOW_HOST_PORT:-5000}:5000"
    volumes:
      - mlflow-data:/mlflow
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate &&
        airflow users create \
          --username "${AIRFLOW_ADMIN_USER}" \
          --password "${AIRFLOW_ADMIN_PASSWORD}" \
          --firstname Admin --lastname NovaMercado \
          --role Admin --email admin@example.com || true
    restart: "no"

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "${AIRFLOW_HOST_PORT:-8080}:8080"
    depends_on:
      <<: *airflow-depends
      airflow-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 10s
      timeout: 10s
      retries: 30
    restart: unless-stopped

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    depends_on:
      <<: *airflow-depends
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped

  # Arranque desde cero: carga el histórico y entrena/registra el primer modelo si no
  # existe uno vigente. En los siguientes arranques detecta que ya existe y termina.
  bootstrap:
    build:
      context: .
      dockerfile: docker/api/Dockerfile
    image: novamercado-api:local
    command: ["python", "-m", "novamercado.arranque"]
    environment:
      NOVA_DB_URL: postgresql+psycopg2://${APP_DB_USER}:${APP_DB_PASSWORD}@db:5432/${APP_DB_NAME}
      MLFLOW_TRACKING_URI: http://mlflow:5000
      DATOS_DIR: /datos
    volumes:
      - ./datos_lab2:/datos:ro
    depends_on:
      db:
        condition: service_healthy
      mlflow:
        condition: service_healthy
    restart: on-failure

  api:
    build:
      context: .
      dockerfile: docker/api/Dockerfile
    image: novamercado-api:local
    environment:
      NOVA_DB_URL: postgresql+psycopg2://${APP_DB_USER}:${APP_DB_PASSWORD}@db:5432/${APP_DB_NAME}
      MLFLOW_TRACKING_URI: http://mlflow:5000
      # Si MLflow no responde, fallar rápido y seguir con el modelo en memoria
      MLFLOW_HTTP_REQUEST_MAX_RETRIES: "0"
      MLFLOW_HTTP_REQUEST_TIMEOUT: "10"
      AIRFLOW_URL: http://airflow-webserver:8080
      AIRFLOW_USER: ${AIRFLOW_ADMIN_USER}
      AIRFLOW_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD}
      DATOS_DIR: /datos
    volumes:
      - ./datos_lab2:/datos:ro
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      mlflow:
        condition: service_started
    restart: unless-stopped

volumes:
  app-db-data:
  airflow-db-data:
  airflow-logs:
  mlflow-data:
